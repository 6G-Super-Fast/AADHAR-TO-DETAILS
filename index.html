<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT RECORDS PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            background: #f9ca24 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            font-family: 'Poppins', 'Segoe UI', sans-serif !important;
        }
        
        /* Main Scrollbar Fix */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f9ca24; }
        ::-webkit-scrollbar-thumb { background: #000; border-radius: 10px; }

        #panFinderCard {
            max-width: 650px; 
            width: 95%;
            padding: 30px 25px 25px 25px;
            background: #f9ca24;
            border: 2px solid #000000;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            margin: 0; 
            display: flex;
            flex-direction: column;
            max-height: 95vh; 
        }
        .badge {
            display: inline-block;
            background: transparent;
            color: #000;
            border: 2px solid #000;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 18px;
            border-radius: 30px;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }
        h2 { font-size: 24px; font-weight: 800; color: #000; margin: 0 0 4px 0; }
        .subtitle { font-size: 14px; color: #000; margin: 0 0 20px 0; font-weight: 500; opacity: 0.8; }
        .form-group { margin-bottom: 15px; text-align: left; width: 100%; }
        label { display: block; font-size: 14px; font-weight: 600; color: #000; margin-bottom: 6px; }
        input[type="text"] {
            background: transparent;
            border: 2px solid #000;
            color: #000;
            padding: 12px 16px;
            font-size: 18px;
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
            outline: none;
            cursor: text;
            user-select: text;
            text-transform: uppercase;
        }
        .btn-main {
            background: transparent;
            color: #000;
            border: 2px solid #000;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0 15px 0;
            font-family: inherit;
        }
        .btn-main:hover { background: #000; color: #f9ca24; }
        .result-wrapper { 
            width: 100%; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #fakeResultDiv {
            background: transparent;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.6;
            color: #000;
            min-height: 50px;
            max-height: 50vh; 
            overflow-y: auto; 
            text-align: left;
            user-select: text;
            word-break: break-word;
        }
        
        /* Result Box Scrollbar Fix */
        #fakeResultDiv::-webkit-scrollbar { width: 6px; }
        #fakeResultDiv::-webkit-scrollbar-track { background: transparent; }
        #fakeResultDiv::-webkit-scrollbar-thumb { background: #000; border-radius: 10px; }
        
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .btn-sub {
            flex: 1;
            background: transparent;
            color: #000;
            border: 2px solid #000;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="panFinderCard">
        <div class="badge">👑 VIP ACCESS</div>
        <h2>📱 CONTACT RECORDS</h2>
        <p class="subtitle">Instantly fetch all linked details</p>

        <form id="checkForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="uidInput">Aadhaar Number</label>
                <input type="text" id="uidInput" maxlength="12" autocomplete="off">
            </div>

            <button type="submit" id="checkBtn" class="btn-main">CHECK DETAILS</button>
        </form>

        <div class="result-wrapper">
            <div id="fakeResultDiv"></div>
        </div>

        <div class="btn-group">
            <button type="button" id="copyBtn" class="btn-sub">📋 COPY TEXT</button>
            <button type="button" id="resetBtn" class="btn-sub">🔄 RESET</button>
        </div>
    </div>

    <script>
        const card = document.getElementById('panFinderCard');
        const uidInput = document.getElementById('uidInput');
        const checkBtn = document.getElementById('checkBtn');
        const fakeResultDiv = document.getElementById('fakeResultDiv');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');

        window.formattedCopyText = "";

        [uidInput, checkBtn, fakeResultDiv, copyBtn, resetBtn].forEach(el => {
            el.addEventListener('mousedown', (e) => e.stopPropagation());
        });

        const savedX = localStorage.getItem('contactCardX');
        const savedY = localStorage.getItem('contactCardY');
        if (savedX !== null && savedY !== null) {
            card.style.left = savedX + 'px';
            card.style.top = savedY + 'px';
            card.style.transform = 'none';
        }

        let isDragging = false, offsetX, offsetY;
        card.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target === fakeResultDiv) return;
            isDragging = true;
            const rect = card.getBoundingClientRect();
            if (card.style.transform !== 'none') {
                card.style.transform = 'none';
                card.style.left = rect.left + 'px';
                card.style.top = rect.top + 'px';
            }
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            card.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            card.style.left = (e.clientX - offsetX) + 'px';
            card.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                card.style.cursor = 'grab';
                const rect = card.getBoundingClientRect();
                localStorage.setItem('contactCardX', rect.left);
                localStorage.setItem('contactCardY', rect.top);
            }
        });

        async function fetchStatus(queryStr) {
            const url = `https://admin.gbssystems.com/public/api/v1/api.php?key=8AF6N&cmd=aadhar&query=${queryStr}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP error: " + res.status);
            return await res.json();
        }

        const emojis = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];

        checkBtn.addEventListener('click', async () => {
            const uidVal = uidInput.value.trim();

            if (uidVal.length !== 12 || isNaN(uidVal)) {
                fakeResultDiv.innerText = 'Enter a valid 12-digit number';
                return;
            }

            fakeResultDiv.innerText = 'Fetching contact records...';
            window.formattedCopyText = ""; 

            try {
                const response = await fetchStatus(uidVal);

                if (response && response.STATUS === "SUCCESS" && response.RESULT) {
                    const rawRecords = response.RESULT;
                    
                    let uniqueRecords = [];
                    let seenNumbers = new Set();
                    
                    rawRecords.forEach(item => {
                        if (!seenNumbers.has(item.NUMBER)) {
                            seenNumbers.add(item.NUMBER);
                            uniqueRecords.push(item);
                        }
                    });

                    const count = uniqueRecords.length;
                    
                    let displayHTML = `📱 <b>Contact Records Details</b> 📱<br>`;
                    displayHTML += `📊 Total Records: ${count}<br><br>`;

                    let copyText = `📱 Contact Records Details 📱\n`;
                    copyText += `📊 Total Records: ${count}\n\n`;

                    if (count > 0) {
                        uniqueRecords.forEach((item, index) => {
                            const emoji = index < 10 ? emojis[index] : `${index + 1}️⃣`;
                            
                            let altNo = (item.ALT && item.ALT.trim() !== "") ? item.ALT : "N/A";
                            let email = (item.EMAIL && item.EMAIL.trim() !== "") ? item.EMAIL : "N/A";
                            
                            displayHTML += `${emoji}<br>`;
                            displayHTML += `👤 Name: ${item.NAME}<br>`;
                            displayHTML += `👨 Father: ${item.FNAME}<br>`;
                            displayHTML += `📞 Number: ${item.NUMBER}<br>`;
                            displayHTML += `☎️ Alt No: ${altNo}<br>`;
                            displayHTML += `📧 Email: ${email}<br>`;
                            displayHTML += `🔒 Aadhaar: ${item.AADHAAR}<br>`;
                            displayHTML += `📶 Circle: ${item.CIRCLE}<br>`;
                            displayHTML += `🏠 Address: ${item.ADDRESS}<br><br>`;

                            copyText += `${emoji}\n`;
                            copyText += `👤 Name: ${item.NAME}\n`;
                            copyText += `👨 Father: ${item.FNAME}\n`;
                            copyText += `📞 Number: ${item.NUMBER}\n`;
                            copyText += `☎️ Alt No: ${altNo}\n`;
                            copyText += `📧 Email: ${email}\n`;
                            copyText += `🔒 Aadhaar: ${item.AADHAAR}\n`;
                            copyText += `📶 Circle: ${item.CIRCLE}\n`;
                            copyText += `🏠 Address: ${item.ADDRESS}\n\n`;
                        });
                    } else {
                        displayHTML += `No unique records found.`;
                        copyText += `No unique records found.`;
                    }

                    fakeResultDiv.innerHTML = displayHTML;
                    window.formattedCopyText = copyText.trim();

                } else {
                    fakeResultDiv.innerText = 'NO RECORDS FOUND ❌';
                }
            } catch (err) {
                console.error(err);
                fakeResultDiv.innerText = 'Error: Connection failed. Check console.';
            }
        });

        function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-999999px";
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                return new Promise((res, rej) => {
                    document.execCommand('copy') ? res() : rej();
                    ta.remove();
                });
            }
        }

        copyBtn.onclick = async () => {
            if (!window.formattedCopyText) return;

            try {
                await copyTextToClipboard(window.formattedCopyText);
                copyBtn.textContent = '✅ COPIED!';
                copyBtn.style.background = '#27ae60';
                copyBtn.style.color = '#fff';
                copyBtn.style.borderColor = '#27ae60';
                setTimeout(() => {
                    copyBtn.textContent = '📋 COPY TEXT';
                    copyBtn.style.background = 'transparent';
                    copyBtn.style.color = '#000';
                    copyBtn.style.borderColor = '#000';
                }, 1500);
            } catch (e) {
                console.error("Copy failed:", e);
            }
        };

        resetBtn.onclick = () => {
            uidInput.value = '';
            fakeResultDiv.innerHTML = '';
            window.formattedCopyText = '';
            localStorage.removeItem('contactCardX');
            localStorage.removeItem('contactCardY');
            card.style.transform = 'translate(-50%, -50%)';
            card.style.top = '50%';
            card.style.left = '50%';
        };
    </script>
</body>
</html>
